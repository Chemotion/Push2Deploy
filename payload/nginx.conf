# Hashed build assets are immutable; everything else (index.html, manifest) must revalidate
map $uri $cache_control {
  ~/assets/ "public, max-age=31536000, immutable";
  default   "no-cache";
}

server {
  listen 80;

  # Emit relative redirects so the client keeps its original scheme (TLS terminates upstream)
  absolute_redirect off;

  # Compress text assets (nginx's default only gzips text/html)
  gzip on;
  gzip_vary on;
  gzip_types text/javascript application/javascript text/css application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;

  # Root directory for all files
  root /usr/share/nginx/html;
  index index.html;

  # Default route for root
  location = / {
    try_files /index.html =404;
  }

  # Redirect bare version URLs to trailing slash so relative asset paths resolve
  location ~ ^/(v[0-9]+\.[0-9]+\.[0-9]+)$ {
    return 301 /$1/;
  }

  # Handle version-specific routes
  location ~ ^/(v[0-9]+\.[0-9]+\.[0-9]+)/ {
    try_files $uri $uri/index.html /$1/index.html =404;
  }

  # Handle all other routes
  location / {
    try_files $uri $uri/ /index.html =404;
  }

  error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;

  location = /404.html {
    internal;
  }

  location = /50x.html {
    internal;
  }
}
