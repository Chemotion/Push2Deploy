services:
  converter-211:
    image: ptrxyz/chemotion:converter-2.1.1
    environment:
      - HTPASSWD_PATH=/passwd/production.htpasswd
    volumes:
      - ${STORAGE}/converter/211/profiles:/srv/chemotion/profiles
      - ${STORAGE}/converter/211/datasets:/srv/chemotion/datasets
      - ${STORAGE}/converter/passwords:/passwd 
  converter-201:
    image: ptrxyz/chemotion:converter-2.0.1
    environment:
      - HTPASSWD_PATH=/passwd/production.htpasswd
    volumes:
      - ${STORAGE}/converter/201/profiles:/srv/chemotion/profiles
      - ${STORAGE}/converter/201/datasets:/srv/chemotion/datasets
      - ${STORAGE}/converter/passwords:/passwd
